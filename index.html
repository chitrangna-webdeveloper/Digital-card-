<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Business Card</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card-container">

        <div class="card" id="card">

            <!-- FRONT -->
            <div class="card-side front">

                <div class="top">
                    <span>C</span>
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>

                <div class="profile">

                    <div class="profile-circle">
                        <img src="profile.jpg" alt="Chitrangna">
                    </div>

                    <h1>Chitrangna</h1>

                    <p class="profession">
                        Frontend Developer
                    </p>

                    <p class="about">
                        Building clean, responsive and beautiful
                        digital experiences.
                    </p>

                </div>

                <div class="social-icons">

                    <a href="#">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="#">
                        <i class="fa-regular fa-envelope"></i>
                    </a>

                </div>

                <button class="contact-btn">
                    <i class="fa-regular fa-envelope"></i>
                    Contact Me
                </button>

                <p class="flip-text">
                    <i class="fa-solid fa-rotate"></i>
                    Tap to flip
                </p>

            </div>


            <!-- BACK -->
            <div class="card-side back">

                <div class="back-content">

                    <p class="small-title">LET'S CONNECT</p>

                    <h2>
                        Let's build<br>
                        <span>something great.</span>
                    </h2>

                    <p>
                        I'm always interested in creating
                        clean and meaningful digital experiences.
                    </p>

                    <div class="details">

                        <div>
                            <i class="fa-regular fa-envelope"></i>
                            <span>chitrangna@gmail.com</span>
                        </div>

                        <div>
                            <i class="fa-solid fa-location-dot"></i>
                            <span>India</span>
                        </div>

                    </div>

                    <button class="contact-btn">
                        <i class="fa-regular fa-paper-plane"></i>
                        Say Hello
                    </button>

                    <p class="flip-text">
                        <i class="fa-solid fa-rotate-left"></i>
                        Tap to flip back
                    </p>

                </div>

            </div>

        </div>

    </div>


    <script>
        const card = document.getElementById("card");

        card.addEventListener("click", function () {
            card.classList.toggle("flipped");
        });
    </script>

</body>
</html>
