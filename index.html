
```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Digital Card</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="card-container">

            <div class="card">

                <!-- FRONT -->
                <div class="card-face card-front">

                    <div class="top-line">
                        <span>DEVELOPER</span>
                        <i class="fa-solid fa-code"></i>
                    </div>

                    <div class="profile">

                        <div class="image-wrapper">
                            <img src="profile.jpg" alt="Profile Image">
                        </div>

                        <h1>Chitrangna</h1>

                        <p class="profession">
                            Frontend Developer
                        </p>

                        <p class="bio">
                            Building clean, responsive & modern digital experiences.
                        </p>

                    </div>

                    <div class="socials">

                        <a href="#" aria-label="GitHub">
                            <i class="fa-brands fa-github"></i>
                        </a>

                        <a href="#" aria-label="LinkedIn">
                            <i class="fa-brands fa-linkedin-in"></i>
                        </a>

                        <a href="#" aria-label="Instagram">
                            <i class="fa-brands fa-instagram"></i>
                        </a>

                    </div>

                    <button class="contact-btn">
                        <i class="fa-regular fa-envelope"></i>
                        Contact Me
                    </button>

                    <div class="flip-hint">
                        <i class="fa-solid fa-rotate"></i>
                        Tap to flip
                    </div>

                </div>


                <!-- BACK -->
                <div class="card-face card-back">

                    <div class="back-content">

                        <span class="back-label">LET'S CONNECT</span>

                        <h2>Have a project<br>
                            <span>in mind?</span>
                        </h2>

                        <p>
                            Let's create something meaningful,
                            elegant and impactful together.
                        </p>

                        <div class="contact-info">

                            <div class="info-item">
                                <i class="fa-regular fa-envelope"></i>
                                <span>hello@example.com</span>
                            </div>

                            <div class="info-item">
                                <i class="fa-solid fa-location-dot"></i>
                                <span>India</span>
                            </div>

                        </div>

                        <button class="contact-btn back-btn">
                            <i class="fa-regular fa-paper-plane"></i>
                            Say Hello
                        </button>

                        <div class="flip-hint">
                            <i class="fa-solid fa-rotate-left"></i>
                            Tap to flip back
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        const card = document.querySelector(".card");

        card.addEventListener("click", function () {
            card.classList.toggle("flipped");
        });
    </script>

</body>
</html>
```
